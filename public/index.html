<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펫프렌즈 상담 채팅 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1F4F7; --surface: #FFFFFF; --ink: #1B2A41; --ink-soft: #5B6B7C; --line: #D6DDE4;
  --accent: #F2A900; --accent-ink: #2B1F00; --accent-soft: #FFF1CC;
  --user-bg: #1B2A41; --user-ink: #F4F7FA;
  --ok: #1F8A5B; --ok-soft: #DDF3E8; --warn: #9A5200; --warn-soft: #FFE9CC; --bad: #B3261E; --bad-soft: #FCE3E0;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161D; --surface: #18212B; --ink: #E6ECF2; --ink-soft: #97A6B5; --line: #2B3744;
    --accent: #F5B730; --accent-ink: #241A00; --accent-soft: #3A2F10;
    --user-bg: #2F4A66; --user-ink: #F4F7FA;
    --ok: #4CC38A; --ok-soft: #173528; --warn: #F0A04B; --warn-soft: #3A2A14; --bad: #FF8A80; --bad-soft: #3E1D1A;
  }
}
:root[data-theme="dark"] {
  --bg: #10161D; --surface: #18212B; --ink: #E6ECF2; --ink-soft: #97A6B5; --line: #2B3744;
  --accent: #F5B730; --accent-ink: #241A00; --accent-soft: #3A2F10;
  --user-bg: #2F4A66; --user-ink: #F4F7FA;
  --ok: #4CC38A; --ok-soft: #173528; --warn: #F0A04B; --warn-soft: #3A2A14; --bad: #FF8A80; --bad-soft: #3E1D1A;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; display: flex; justify-content: center; word-break: keep-all; overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { width: 100%; max-width: 520px; height: 100%; background: var(--surface); border-left: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.app.wide { max-width: 1360px; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view[hidden] { display: none; }

.top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.logo { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; flex: none; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.brand > div:last-child { min-width: 0; }
.brand strong { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.brand strong .ver { margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .2px; }
.brand small { display: block; font-size: 12px; color: var(--ink-soft); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 13px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.pill:hover { background: var(--accent-soft); }

.strip-toggle { text-align: left; background: var(--bg); border: 0; border-bottom: 1px solid var(--line); padding: 9px 16px; font-size: 13px; color: var(--ink-soft); }
.strip { display: flex; gap: 10px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.strip[hidden] { display: none; }
.pc { flex: none; width: 168px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.pc:hover { border-color: var(--accent); }
.pc .nm { font-size: 13px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
.pc .pr { margin-top: 6px; font-size: 14px; font-weight: 600; }
.pc .pr s { font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-right: 4px; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; margin-top: 6px; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-gray { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line); }

.log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
.note { align-self: center; max-width: 92%; text-align: center; font-size: 12.5px; color: var(--ink-soft); }
.hint { align-self: stretch; font-size: 13px; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
.hint b { font-weight: 600; }
.msg { max-width: 88%; }
.msg.bot { align-self: flex-start; }
.msg.bot .bd { background: var(--bg); border-radius: 4px 16px 16px 16px; padding: 10px 14px; }
.msg.bot .bd p { margin: 0 0 8px; white-space: pre-line; }
.msg.bot .bd p:last-child { margin-bottom: 0; }
.msg.bot.cont { margin-bottom: -6px; }
.msg.bot.cont .tm { display: none; }
.msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-ink); border-radius: 16px 16px 4px 16px; padding: 9px 14px; white-space: pre-wrap; word-break: break-word; }
.msg .tm { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-soft); }
.msg.user .tm { color: inherit; opacity: .7; text-align: right; }
.cards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.cards .pc { width: 100%; }
.pcw { flex: none; width: 168px; display: flex; flex-direction: column; gap: 6px; }
.pcw .pc { width: 100%; flex: 1; }
.cards .pcw { width: 100%; }
.buy { font: inherit; font-size: 13px; font-weight: 500; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 10px; }
.buy:disabled { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); cursor: default; }
.qty-sel { width: auto !important; min-width: 110px; }
.typing { align-self: flex-start; display: flex; align-items: center; gap: 5px; padding: 8px 14px; background: var(--bg); border-radius: 4px 16px 16px 16px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.typing span { margin-left: 6px; font-size: 12.5px; color: var(--ink-soft); }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.oc { align-self: stretch; border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); }
.oc-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.oc-h strong { font-size: 14px; font-weight: 600; }
.st { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; }
.oc-i { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-soft); }
.steps { display: flex; margin: 14px 0 4px; padding: 0; list-style: none; }
.steps li { flex: 1; min-width: 0; text-align: center; font-size: 11.5px; letter-spacing: -0.3px; white-space: nowrap; color: var(--ink-soft); position: relative; padding-top: 16px; }
.steps li::before { content: ""; position: absolute; top: 2px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--line); }
.steps li::after { content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.steps li:first-child::after { display: none; }
.steps li.done::before, .steps li.done::after { background: var(--ok); }
.steps li.cur { color: var(--ink); font-weight: 600; }
.steps li.cur::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.steps li.cur::after { background: var(--ok); }
.steps li::before { z-index: 1; }
.oc-t { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-soft); }
.tl { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; border-top: 1px solid var(--line); }
.tl li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.tl li:first-child { font-weight: 500; }
.tl time { flex: none; width: 92px; color: var(--ink-soft); font-size: 12px; font-weight: 400; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
.chips:empty { display: none; }
.chip { font-size: 13.5px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip.act { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.chips .cap { width: 100%; font-size: 12px; color: var(--ink-soft); }
.composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 16px 8px; border-top: 1px solid var(--line); }
textarea.in { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 9px 14px; max-height: 130px; line-height: 1.5; }
textarea.in::placeholder { color: var(--ink-soft); }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .35; cursor: default; }
.send svg { width: 19px; height: 19px; }
.foot { text-align: center; font-size: 11.5px; color: var(--ink-soft); padding: 0 16px 10px; margin: 0; }

.login { flex: 1; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 24px; }
.lcard { width: 100%; max-width: 380px; border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
.lcard h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
.lcard p { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }
.pw { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
.pw code { display: block; margin-top: 4px; font-size: 18px; font-weight: 600; letter-spacing: .5px; font-family: var(--sans); }
.fld { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.btn { font: inherit; font-weight: 500; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 16px; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.full { width: 100%; margin-top: 12px; }
.err { color: var(--bad); font-size: 13px; margin: 8px 0 0; min-height: 20px; }
.link { background: none; border: 0; color: var(--ink-soft); font-size: 13px; text-decoration: underline; padding: 8px 0 0; }

.saved { font-size: 12.5px; color: var(--ok); opacity: 0; transition: opacity .3s; }
.saved.on { opacity: 1; }
.tblw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 940px; }
.tbl th { text-align: left; padding: 9px 10px; background: var(--bg); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl input, .tbl select, .ocard input, .ocard select, .trk input, .trk select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
.tbl input[type=number] { min-width: 88px; }
.tbl select { min-width: 92px; }
.tbl td.stc { white-space: nowrap; }
.tbl td.nm { min-width: 250px; }
.tbl td.stc .badge { margin-top: 0; white-space: nowrap; }
.hintp { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }
.ocard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.ocard .oh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
.ocard .oh strong { font-size: 14.5px; font-weight: 600; }
.ocard .tot { margin-left: auto; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid label, .trk label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
.irows { margin-top: 10px; }
.irow { display: grid; grid-template-columns: 1fr 80px 36px; gap: 8px; margin-bottom: 6px; }
.x { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--bad); }
.ob { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.trk { max-width: 820px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
@media (max-width: 640px) { .trk { padding: 14px; } }
.evrow { display: grid; grid-template-columns: 170px 1fr 36px; gap: 8px; margin-bottom: 6px; }
.stat { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
@media (max-width: 560px) { .evrow { grid-template-columns: 1fr 36px; } .evrow input:first-child { grid-column: 1 / 3; } }
.rq { align-self: stretch; border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.rq [hidden] { display: none !important; }
.rq-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rq-h strong { font-size: 14.5px; font-weight: 600; }
.rq-h span { font-size: 12px; color: var(--ink-soft); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; background: transparent; border: 0; padding: 9px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.rq-lb { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.ri { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.ri.off { opacity: .55; }
.rl { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.rl input { margin-top: 5px; flex: none; }
.rl small { color: var(--ink-soft); }
.rsel { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.rq select, .rq textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.rq-sum { font-size: 13px; background: var(--bg); border-radius: 10px; padding: 10px 12px; line-height: 1.6; }
.rq-sum .e { color: var(--bad); }
.rq-act { display: flex; gap: 8px; }
.rq-act .btn { flex: 1; }
.btn:disabled { opacity: .4; cursor: default; }
@media (max-width: 640px) {
  input, select, textarea { font-size: 16px !important; }
  .top { padding: 10px 12px; gap: 8px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; }
  .pill { font-size: 12.5px; padding: 6px 11px; min-height: 34px; }
  .strip-toggle { padding: 10px 12px; }
  .strip { padding: 10px 12px; }
  .pc { width: 156px; }
  .log { padding: 14px 12px 6px; gap: 12px; }
  .msg { max-width: 94%; }
  .oc { padding: 12px; }
  .tl time { width: 78px; }
  .chips { flex-wrap: wrap; gap: 6px; overflow-y: auto; max-height: 150px; padding: 0 12px 8px; }
  .chip { white-space: nowrap; min-height: 34px; font-size: 13px; padding: 5px 11px; }
  .chips .cap { width: 100%; }
  .composer { padding: 8px 12px 6px; }
  .foot { font-size: 11px; padding: 0 12px 8px; }
  .login { padding: 16px; align-items: flex-start; }
  .lcard { padding: 20px; }
  .tblw { border: 0; overflow: visible; }
  table.tbl { min-width: 0; }
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 6px 2px; }
  .tbl td { display: grid; grid-template-columns: 84px 1fr; gap: 8px; align-items: center; border: 0; padding: 5px 10px; }
  .tbl td::before { content: attr(data-label); font-size: 12px; color: var(--ink-soft); }
  .tbl td:first-child { font-weight: 600; padding-top: 8px; }
  .tbl td.nm { min-width: 0; }
  .tbl td.stc .badge { justify-self: start; }
  .ocard { padding: 12px; }
  .ocard .oh .tot { margin-left: 0; width: 100%; }
  .grid { grid-template-columns: 1fr 1fr; }
  .grid > div:first-child { grid-column: 1 / 3; }
  .irow { grid-template-columns: 1fr 64px 40px; }
  .x { min-height: 36px; }
  .ob .btn { flex: 1; }
}
@media (max-width: 400px) {
  .brand small { display: none; }
  .pill { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { .log { scroll-behavior: auto; } .typing i { animation: none; opacity: .6; } }
.lgd { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: var(--surface); }
.lgd > summary { cursor: pointer; padding: 11px 14px; font-size: 13.5px; line-height: 1.45; list-style: none; }
.lgd > summary::-webkit-details-marker { display: none; }
.lgd[open] > summary { border-bottom: 1px solid var(--line); }
.lgw { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lgm { font-size: 13.5px; line-height: 1.5; max-width: 94%; }
.lgm.user { align-self: flex-end; }
.lgm.bot { align-self: flex-start; width: 94%; }
.lgm .lgt { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lgm .lgb { background: var(--bg); border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
.lgm.user .lgb { background: var(--user-bg); color: var(--user-ink); }
.lgn { align-self: center; font-size: 12px; color: var(--ink-soft); background: var(--bg); border-radius: 999px; padding: 3px 12px; text-align: center; }
.lgi > summary { font-size: 12px; color: var(--ink-soft); cursor: pointer; margin-top: 4px; }
.lgi pre { white-space: pre-wrap; font: inherit; font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
.fbx { border: 1px dashed var(--line); border-radius: 10px; padding: 8px; margin-top: 6px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.fbr { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fbb { font: inherit; font-size: 12.5px; color: var(--ink); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; }
.fbb.on.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.fbb.on.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
.fbk { font-size: 12.5px; color: var(--ink-soft); margin-left: auto; display: flex; gap: 4px; align-items: center; white-space: nowrap; }
.fbx textarea, .lgg { font: inherit; font-size: 13px; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); color: var(--ink); resize: vertical; }
.lgpre { white-space: pre-wrap; font: inherit; font-size: 12px; line-height: 1.55; background: var(--bg); border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 260px; overflow: auto; }
.lgtabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.pill.sel { background: var(--accent-soft); border-color: var(--accent); }
.lgtag { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--accent-soft); color: var(--ink); }
.lgq { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 6px; white-space: pre-wrap; word-break: break-word; }
.rpt { margin-top: 2px; }
.rpt-btn { font: inherit; font-size: 12px; color: var(--ink-soft); background: none; border: 0; padding: 2px 0; text-decoration: underline; cursor: pointer; }
.rpt-btn:disabled { text-decoration: none; cursor: default; color: var(--bad); }
.rq .rp-d { width: 100%; resize: vertical; }
/* ---------- 관리자: 왼쪽 세로 메뉴 + 작업 영역 ---------- */
.adm-shell { flex: 1; min-height: 0; display: flex; }
.adm-side { width: 240px; flex: none; display: flex; flex-direction: column; gap: 14px; padding: 18px 12px 14px; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
.adm-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; }

      else q('반품·교환 가능한지 확인', id + ' 반품이나 교환이 가능한지 알려 주세요');

  function setBody(body, text) {
    body.innerHTML = '';

  }
  /* 긴 답변은 주제(문단)별로 말풍선을 나눠 보여 준다 */
  var SPLIT_MIN = 110, SPLIT_MAX = 4, SENT_MAX = 130, BLOB_MIN = 200;
  function answerChunks(text) {
    var t = String(text), paras = t.split(/\n{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (t.length < SPLIT_MIN) return [paras.join('\n\n')];
    if (paras.length === 1) { /* 문단 구분 없이 긴 한 덩어리면 문장 단위로 묶어 나눈다 */
      if (t.length < BLOB_MIN) return paras;
      var sents = paras[0].split(/(?<=[.!?])\s+/), out = [], cur = '';
      sents.forEach(function (x) { if (cur && (cur + ' ' + x).length > SENT_MAX) { out.push(cur); cur = x; } else cur = cur ? cur + ' ' + x : x; });
      if (cur) out.push(cur);
      paras = out;
    }
    if (paras.length > SPLIT_MAX) paras = paras.slice(0, SPLIT_MAX - 1).concat([paras.slice(SPLIT_MAX - 1).join('\n\n')]);
    return paras;
  }
  function setAnswer(ans, text) { /* ans: 말풍선 배열. 마지막 말풍선을 돌려준다 */
    var chunks = answerChunks(text);
    while (ans.length < chunks.length) { ans[ans.length - 1].root.classList.add('cont'); ans.push(newBot()); }
    while (ans.length > chunks.length) { ans.pop().root.remove(); ans[ans.length - 1].root.classList.remove('cont'); }
    chunks.forEach(function (c, i) { setBody(ans[i].body, c); });
    return ans[ans.length - 1];
  }

      '<div style="font-size:13px">' + disc + won(p.sale) + ' ' + stockBadge(p) + '</div>' +
      '<div class="rq-lb">수량</div><select class="rc-q qty-sel" aria-label="수량">' + qopts + '</select>' +
      '<div class="rq-sum" aria-live="polite"></div>' +
      '<div class="rq-act"><button class="btn" type="button" data-sub>주문하기</button><button class="btn ghost" type="button" data-close>닫기</button></div>';
    log.appendChild(card); scroll();

    function update() {
      var qty = Number(card.querySelector('.rc-q').value) || 1, live = prod(p.id), err = '';
      if (!live || live.stock <= 0) err = '이 상품은 방금 품절됐어요.';
      else if (live.stock < qty) err = '재고가 부족해요 (재고 ' + live.stock + '개). 수량을 줄여 주세요.';
      var sum = '<b>결제금액 ' + won((live ? live.sale : p.sale) * qty) + '</b> (' + won(live ? live.sale : p.sale) + ' × ' + qty + '개)<br>배송지와 결제 수단은 마이페이지에 등록된 기본 정보로 처리돼요. 체험용이라 실제 결제는 일어나지 않아요.';
      if (err) sum += '<br><span class="e">' + esc(err) + '</span>';
      card.querySelector('.rq-sum').innerHTML = sum;
      card.querySelector('[data-sub]').disabled = !!err;
      return qty;
    }
    card.addEventListener('change', function (e) { if (e.target.classList.contains('rc-q')) update(); });
    card.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-close')) { card.remove(); delete S.openForms[key]; addNote('주문 카드를 닫았어요. 다시 주문하려면 상품 카드의 ‘주문하기’를 눌러 주세요.'); return; }
      if (b.hasAttribute('data-sub')) {
        var qty = update(); if (b.disabled) return;
        var live = prod(p.id);
        if (!live || live.stock < qty) { renderStrip(); return; }
        var ymd = todayStr().slice(5).replace('-', '');
        var mk = function (oid) { return { id: oid, name: '홍*동', date: todayStr(), status: '결제완료', items: [{ pid: live.id, qty: qty }], carrier: '', tracking: '', events: [{ t: nowStamp(), d: '결제 완료' }] }; };
        var finish = function (no) {
          var oid = no.id;
          renderStrip();
          card.replaceWith(orderCard(no)); delete S.openForms[key];
          S.lastOrder = oid;
          logEntry('sys', '주문 완료 ' + oid + ' · ' + live.name + ' ' + qty + '개 · ' + won(total(no)));
          var bb = newBot();
          setBody(bb.body, '주문이 완료됐어요. 주문번호는 ' + oid + ' 이에요.\n\n' + live.name + ' ' + qty + '개, 결제금액 ' + won(total(no)) + '이에요. 결제 후 평일 기준 1일 이내 출고되고, 주문번호로 배송 상태를 언제든 물어보실 수 있어요.' + (live.stock <= 0 ? '\n\n이 상품은 방금 주문으로 재고가 모두 소진돼 품절 처리됐어요.' : ''));
          scroll();
          refreshChips();
        };
        if (FB) { /* 서버에서 재고 확인·차감과 주문 생성을 한 번에 처리 */
          b.disabled = true;
          fbPlaceOrder(live.id, qty, 'PF-' + ymd + '-', mk).then(function (r) {
            if (!r.ok) {
              b.disabled = false;
              if (r.why === 'stock') { live.stock = r.stock; renderStrip(); addNote('방금 재고가 줄었어요. 남은 재고는 ' + r.stock + '개예요. 수량을 줄여 다시 주문해 주세요.'); update(); }
              else addNote('이 상품은 지금 주문할 수 없어요.');
              return;
            }
            live.stock = r.stock; DB.orders.unshift(r.order);
            snapOf('orders')[r.order.id] = canon(r.order); snapOf('products')[live.id] = canon(live);
            finish(r.order);
          }).catch(function (e3) { console.warn(e3); b.disabled = false; addNote('주문을 처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.'); });
          return;
        }
        live.stock = Math.max(0, live.stock - qty);
        var n = 1, oid;
        do { oid = 'PF-' + ymd + '-' + String(n).padStart(2, '0'); n++; } while (order(oid));
        var no = mk(oid);
        DB.orders.unshift(no);
        save();
        finish(no);
      }
    });
    update();
  }

  function orderText(o) {
    var items = o.items.map(function (i) { var p = prod(i.pid); return (p ? p.name : i.pid) + ' x' + i.qty; }).join(', ');
    var ev = o.events.slice().sort(function (a, b) { return a.t < b.t ? -1 : 1; }).map(function (e) { return '    ' + e.t + ' ' + e.d; }).join('\n');
    return '- 주문 ' + o.id + '\n  주문자: ' + o.name + '\n  주문일: ' + o.date + '\n  상태: ' + o.status + '\n  상품: ' + items + '\n  결제금액: ' + won(total(o)) + '\n  택배사: ' + (o.carrier || '없음') + ' / 운송장: ' + (o.tracking || '없음') + '\n  추적 기록:\n' + (ev || '    기록 없음') + (function () { var rs = DB.requests.filter(function (r) { return r.orderId === o.id; }); return rs.length ? '\n  반품·교환 접수 내역:\n' + rs.map(reqText).join('\n') : ''; })();
  }
  function productList() {
    return '[상품 목록 - 시험용]\n' + DB.products.map(function (p) {
      var pct = p.price > p.sale ? ' (' + Math.round((1 - p.sale / p.price) * 100) + '% 할인)' : '';
      var st = p.stock <= 0 ? '품절' + (p.restock ? ', 입고 예정 ' + p.restock : '') : p.stock + '개';
      return '- ' + p.id + ' | ' + p.name + ' | ' + p.cat + ' | 정상가 ' + won(p.price) + ' | 판매가 ' + won(p.sale) + pct + ' | 재고 ' + st;
    }).join('\n');
  }
  function reqText(r) {
    var last = r.history.length ? r.history[r.history.length - 1] : null;
    return '    - ' + r.id + ' (' + r.type + ', 처리 상태: ' + r.status + ') 접수일 ' + r.createdAt + ' / 사유: ' + r.reason + (r.detail ? ' (' + r.detail + ')' : '') + ' / 상품: ' + itemsText(r) + ' / ' + amountText(r) + ' / 수거: ' + r.pickup + (r.memo ? ' / 처리 메모: ' + r.memo : '') + (last ? ' / 최근 이력: ' + last.t + ' ' + last.d : '');
  }
  /* 번호 정규화: 'pf1116-1', 'PF-1116-001', 예전 'PF-20261116-001' 모두 'PF-1116-01' 형식으로 맞춘다 */
  function normId(pre, raw) {
    var d = String(raw).replace(/\D/g, ''), md, rest;
    if (d.length >= 10) { md = d.slice(4, 8); rest = d.slice(8); } else { md = d.slice(0, 4); rest = d.slice(4); }
    return pre + '-' + md + '-' + String(Number(rest)).padStart(2, '0');
  }
  function buildContext(text) {
    var ids = [], rids = [];
    (text.match(/PF-?\d{4}(?:\d{4})?-?\d{2,3}/gi) || []).forEach(function (x) {
      var x2 = normId('PF', x);
      if (ids.indexOf(x2) < 0) ids.push(x2);
    });
    (text.match(/(?:RT|EX)-?\d{4}(?:\d{4})?-?\d{2,3}/gi) || []).forEach(function (x) {
      var x2 = normId(x.slice(0, 2).toUpperCase(), x);
      if (rids.indexOf(x2) < 0) rids.push(x2);
    });
    var explicit = ids.length > 0 || rids.length > 0;
    var reqCards = [], lines = [];
    rids.forEach(function (rid) {
      var r = reqById(rid);
      if (!r) { lines.push('- 접수번호 ' + rid + ': 존재하지 않는 접수번호'); return; }
      reqCards.push(r);
      if (ids.indexOf(r.orderId) < 0) ids.push(r.orderId);
    });
    var wantAction = /(반품|교환|환불)/.test(text) && /(접수|신청|하고\s*싶|하려|할래|할게|해\s*주|원해|돌려\s*보내|바꾸고|바꿔)/.test(text);
    var type = /교환/.test(text) && !/반품/.test(text) ? '교환' : '반품';
    if (wantAction) S.intent = type;
    var intent = wantAction ? type : (S.intent && ids.length ? S.intent : null);
    var buy = null, buyLines = [];
    var wantBuy = !wantAction && /(주문\s*(좀\s*)?(할게|할래|할께|하고\s*싶|하려|하겠|해\s*주|해\s*줘|넣을게|넣을래|넣고\s*싶|부탁|원해|원합)|(구매|구입)\s*(할게|할래|할께|하고\s*싶|하려|하겠|원|부탁)|사고\s*싶|사볼|사줘|사\s*주세요|담아\s*(줘|주세요)|살게|살래|살께|사려)/.test(text) && !/(취소|배송|조회|반품|교환|환불|출고|변경|PF-?\d{4})/i.test(text);
    if (wantBuy) {
      var bh = DB.products.filter(function (x) { return text.indexOf(x.name) >= 0 || (x.kw || []).some(function (k) { return k.length >= 2 && text.indexOf(k) >= 0; }); });
      if (bh.length === 0) buyLines.push('- 주문 요청이 있으나 어떤 상품인지 알 수 없음. 상품명을 물어볼 것');
      else if (bh.length > 1) buyLines.push('- 주문 요청이 있으나 상품이 여러 개(' + bh.map(function (x) { return x.name; }).join(', ') + ')라 하나로 특정되지 않음. 하나를 골라 달라고 안내');
      else {
        var bp = bh[0];
        if (bp.stock <= 0) buyLines.push('- ' + bp.name + ': 품절 - 주문 불가' + (bp.restock ? ', 입고 예정 ' + bp.restock : ''));
        else if (S.openForms['buy:' + bp.id]) buyLines.push('- ' + bp.name + ': 주문 카드가 이미 화면에 열려 있음. 카드에서 진행하도록 안내');
        else { buyLines.push('- ' + bp.name + ' (재고 ' + bp.stock + '개): 주문 가능. 답변 아래에 주문 카드가 나타남. 수량은 카드에서 고르도록 안내'); buy = bp; }
      }
    }
    if (!ids.length && S.lastOrder) ids = [S.lastOrder];
    var cards = [], elig = [], form = null;
    ids.forEach(function (id) {
      var o = order(id);
      if (!o) { lines.push('- 주문번호 ' + id + ': 존재하지 않는 주문번호'); return; }
      S.lastOrder = id;
      lines.push(orderText(o));
      if (explicit && reqCards.every(function (r) { return r.orderId !== id; })) cards.push(o);
      else if (explicit && !reqCards.length) cards.push(o);
      if (intent) {
        var e = eligibility(o);
        if (e.ok && S.openForms[o.id]) elig.push('- 주문 ' + o.id + ': 접수 카드가 이미 화면에 열려 있음. 카드에서 진행하도록 안내');
        else { elig.push('- 주문 ' + o.id + ' (' + intent + ' 요청): ' + (e.ok ? e.msg + '. 답변 아래에 접수 카드가 나타남' : '접수 불가 - ' + e.msg)); if (e.ok && !form) form = { order: o, type: intent }; }
        S.intent = null;
      }
    });
    if (!lines.length) lines.push('- 이번 메시지에 주문번호가 없음');
    if (intent && !elig.length) elig.push('- ' + intent + ' 접수 요청이 있으나 주문번호가 없음. 주문번호를 요청할 것');
    var block = elig.length ? '\n\n[접수 가능 여부]\n' + elig.join('\n') : '';
    if (buyLines.length) block += '\n\n[주문 가능 여부]\n' + buyLines.join('\n');
    return { text: productList() + '\n\n' + POLICY + '\n\n[조회 결과]\n' + lines.join('\n') + block, cards: cards, reqCards: reqCards, form: form, buy: buy, info: block.trim() };
  }

  // claude.ai 밖에서 server.js(localhost)로 열었을 때 쓰는 대체 sample. claude.ai 안에서는 기존 방식을 그대로 쓴다.
  function localSample() {
    return async function (msgs, opt) {
      opt = opt || {};
      var acc = '';
      var res;
      try {
        res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: msgs }), signal: opt.signal });
        if (!res.ok) { var j = {}; try { j = await res.json(); } catch (e) {} throw { code: j.code || 'api_error' }; }
        var rd = res.body.getReader(), dc = new TextDecoder();
        for (;;) {
          var r = await rd.read();
          if (r.done) break;
          acc += dc.decode(r.value, { stream: true });
          if (opt.onText) opt.onText({ text: acc.replace('\u0001CUT', '') });
        }
      } catch (e) {
        if (e && e.name === 'AbortError') throw { code: 'cancelled', text: acc };
        throw (e && e.code) ? e : { code: 'network', text: acc };
      }
      var cut = acc.indexOf('\u0001CUT') >= 0; acc = acc.replace('\u0001CUT', '');
      if (!acc) throw { code: 'empty_completion' };
      return { text: acc, truncated: cut };
    };
  }
  var samplePromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('sample').catch(function () { return null; })
    : (location.protocol === 'http:' || location.protocol === 'https:') ? Promise.resolve(localSample())
    : Promise.resolve(null);

  function errorCopy(code) {
    switch (code) {
      case 'rate_limited': return '요청이 많거나 사용량 한도에 도달했어요. 잠시 뒤에 다시 보내 주세요.';
      case 'session_expired': return '로그인이 만료되었어요. 페이지를 다시 열어 로그인해 주세요.';
      case 'refused': return 'Claude가 이 입력에는 답하지 못했어요. 표현을 바꿔서 다시 보내 주세요.';
      case 'empty_completion': return '답변이 비어 있었어요. 메시지를 조금 바꿔서 다시 보내 주세요.';
      case 'prompt_too_large': return '대화가 너무 길어졌어요. 새 대화를 시작해 주세요.';
      case 'no_key': return '서버에서 API 키를 찾지 못했어요. 로컬은 .env의 ANTHROPIC_API_KEY, Firebase 배포는 시크릿 설정을 확인해 주세요.';
      case 'bad_key': return 'API 키가 올바르지 않거나 사용 권한이 없어요. 키와 크레딧 잔액을 확인해 주세요.';
      case 'network': return '서버나 Claude에 연결하지 못했어요. 터미널에서 서버가 실행 중인지 확인해 주세요.';
      default: return '답변을 가져오는 중 문제가 생겼어요. 같은 메시지를 다시 보내 주세요.';
    }
  }
  function lock(msg) { S.locked = true; input.disabled = true; input.placeholder = '상담을 사용할 수 없어요'; addNote(msg); updateSend(); }

  async function reply(text) {
    S.hist.push({ role: 'user', content: text });
    S.busy = true; setChips([]); updateSend();
    var sample = await samplePromise;
    if (!sample) { S.hist.pop(); S.busy = false; lock('이 화면에서는 Claude 연결을 쓸 수 없어요. Claude 앱이나 claude.ai에서 이 페이지를 열어 주세요.'); return; }
    var ctx = buildContext(text);
    logEntry('user', text);
    var gd = feedbackGuide();
    ctx.cards.forEach(function (o) { log.appendChild(orderCard(o)); });
    ctx.reqCards.forEach(function (r) { log.appendChild(reqCard(r)); });
    scroll();
    var turns = S.hist.slice(-12).map(function (m) { return { role: m.role, content: m.content }; });
    while (turns.length && turns[0].role !== 'user') turns.shift();
    turns[turns.length - 1] = { role: 'user', content: ctx.text + '\n\n[고객 메시지]\n' + text };
    var input2 = [{ role: 'user', content: RULES + gd.text }, { role: 'assistant', content: GREETING }].concat(turns);

    S.ctl = new AbortController(); setStop(true); updateSend();
    var typing = addTyping('확인하고 있어요');
    var bubble = null, ans = [], finalText = null, failed = null, truncated = false;
    try {
      var res = await sample(input2, {
        cache: false, signal: S.ctl.signal, modelTier: 'default',
        onText: function (o) { if (!bubble) { typing.remove(); ans.push(newBot()); } bubble = setAnswer(ans, o.text); scroll(); }
      });
      finalText = res.text; truncated = !!res.truncated;
      if (!ans.length) { typing.remove(); ans.push(newBot()); }
      bubble = setAnswer(ans, finalText);
    } catch (e) {
      failed = e || {};
      if (typing.parentNode) typing.remove();
      if (failed.text) { finalText = failed.text; if (!ans.length) ans.push(newBot()); bubble = setAnswer(ans, finalText); }
    }
    if (finalText) {
      S.hist.push({ role: 'assistant', content: finalText });
      var be = logEntry('bot', finalText, { info: ctx.info || '', applied: gd.count, status: failed ? 'stopped' : truncated ? 'cut' : 'ok' });
      var hay = text + ' ' + finalText, shown = [];
      DB.products.forEach(function (p) {
        if (shown.length >= 3) return;
        var hit = hay.indexOf(p.name) >= 0 || (p.kw || []).some(function (k) { return k.length >= 2 && hay.indexOf(k) >= 0; });
        if (hit) shown.push(p);
      });
      if (shown.length && bubble) { var c = el('div', 'cards'); shown.forEach(function (p) { c.appendChild(prodCard(p)); }); bubble.root.insertBefore(c, bubble.root.querySelector('.tm')); }
      if (bubble && be) addReportUi(bubble.root, be);
      if (ctx.form) addRequestForm(ctx.form.order, ctx.form.type);
      if (ctx.buy) addOrderForm(ctx.buy.id);
    } else { S.hist.pop(); logEntry('sys', '답변을 받지 못했어요 (' + ((failed && failed.code) || '오류') + ')'); }
    if (truncated) addNote('답변이 길이 제한 때문에 중간에 끊겼어요. "이어서 설명해 줘"라고 보내 주시면 이어서 알려 드려요.');
    if (failed) {
      if (failed.code === 'cancelled') addNote('답변을 멈췄어요.');
      else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(failed.code) >= 0) lock('Claude 사용이 허용되지 않아 상담을 쓸 수 없어요.');
      else addNote(errorCopy(failed.code));
    }
    scroll();
    S.ctl = null; S.busy = false; setStop(false);
    if (!S.locked) refreshChips();
    updateSend();
  }
  function submit(t) {
    t = (t || input.value).trim();
    if (!t || S.busy || S.locked) return;
    addUser(t); input.value = ''; autosize(); updateSend(); reply(t);
  }
  function startChat() {
    if (S && S.ctl) S.ctl.abort();
    resetChatState(); log.innerHTML = '';
    input.disabled = false; input.placeholder = '재고, 주문, 배송이 궁금하신가요?'; input.value = ''; autosize(); setStop(false);
    var b = newBot(); setBody(b.body, GREETING);
    var o = DB.orders[0], eo = DB.orders.filter(function (x) { return eligibility(x).ok; })[0];
    if (o) log.appendChild(el('div', 'hint', '<b>체험용 안내</b> 주문번호 ' + esc(o.id) + ' 를 입력하면 주문과 배송 상태를 조회할 수 있어요.' + (eo ? ' 반품·교환 접수는 ' + esc(eo.id) + ' 로 해 볼 수 있어요.' : '') + ' 다른 주문번호는 관리자 화면에서 확인하고 수정할 수 있어요.'));
    renderStrip(); setChips(CHIPS); updateSend();

    sort: 'at', dir: -1, ph: '질문·답변·코멘트 검색', hint: '관리자가 남긴 피드백 모음이에요. "반영"을 켜 둔 피드백만 다음 답변부터 챗봇 지침에 붙어요. 대화 기록을 지워도 피드백은 남아요.',
    rows: function () { return CH.feedback.filter(fbMeaningful); }, id: function (f) { return f.id; }, attr: function (f) { return 'data-fid="' + esc(f.id) + '"'; },
    kpis: [{ key: 'all', label: '전체 피드백', tone: 'info' }, { key: 'bad', label: '아쉬워요', tone: 'bad', fn: function (f) { return f.rating === 'bad'; } }, { key: 'good', label: '좋았어요', tone: 'ok', fn: function (f) { return f.rating === 'good'; } }, { key: 'on', label: '지침 반영 중', tone: 'warn', fn: function (f) { return f.on !== false; } }],
    filters: [{ key: 'rating', label: '평가', opts: function () { return [['bad', '아쉬워요'], ['good', '좋았어요'], ['none', '코멘트만']]; }, fn: function (f, v) { return v === 'none' ? !f.rating : f.rating === v; } }, { key: 'on', label: '반영', opts: function () { return [['on', '반영 중'], ['off', '반영 안 함']]; }, fn: function (f, v) { return v === 'on' ? f.on !== false : f.on === false; } }],
    sorts: [{ key: 'at', label: '최근 수정', val: function (f) { return f.at; } }, { key: 'rating', label: '평가', val: function (f) { return f.rating || 'z'; } }, { key: 'q', label: '고객 질문', val: function (f) { return f.q || ''; } }],
    text: function (f) { return [f.q, f.a, f.note, f.ideal].join(' '); },
    cols: ['평가', '고객 질문', '답변', '관리자 코멘트', '지침 반영', '수정 시각', ''],
    row: function (f, open, key) {
      return '<tr data-fid="' + esc(f.id) + '"><td data-label="평가">' + rating(f) + '</td><td data-label="고객 질문">' + esc(clip(f.q, 36)) + '</td><td data-label="답변">' + esc(clip(f.a, 44)) + '</td><td data-label="관리자 코멘트">' + (f.note || f.ideal ? esc(clip(f.note || f.ideal, 44)) : '-') + '</td>' +
        '<td data-label="지침 반영"><label class="sw"><input type="checkbox" data-fb="on"' + (f.on !== false ? ' checked' : '') + '> 반영</label></td><td data-label="수정 시각">' + esc(f.at) + '</td><td data-label="" class="act">' + tglBtn(key, open) + '</td></tr>';
    },
    detail: function (f) {
      return '<div class="fbc" data-fid="' + esc(f.id) + '">' + (f.q ? '<p class="lgq"><b>고객 질문</b> ' + esc(clip(f.q, 400)) + '</p>' : '') + '<p class="lgq"><b>답변</b> ' + esc(clip(f.a, 800)) + '</p>' + fbBox(null, f) +
        '<div style="margin-top:8px"><button type="button" class="fbb" data-fb="del" style="color:var(--bad)">이 피드백 삭제</button></div></div>';
    }
  };

  LISTS.rp = {
    sort: 'at', dir: -1, dtc: 'rpc', ph: '질문·답변·의견·메모 검색', hint: '고객이 "신고하기"로 접수한 답변이에요. 상태를 바꾸고 메모를 남기거나, "피드백으로 보내기"로 챗봇 개선에 연결할 수 있어요(반영은 검토 후 직접 켜야 해요).',
    rows: function () { return CH.reports; }, id: function (r) { return r.id; }, attr: function (r) { return 'data-rpid="' + esc(r.id) + '"'; },
    kpis: [{ key: 'all', label: '전체 신고', tone: 'info' }, { key: 'pend', label: '접수 (미처리)', tone: 'warn', fn: function (r) { return r.status === '접수'; } }, { key: 'prog', label: '확인 중', tone: 'info', fn: function (r) { return r.status === '확인 중'; } }, { key: 'done', label: '처리 완료', tone: 'ok', fn: function (r) { return r.status === '처리 완료'; } }],
    filters: [{ key: 'reason', label: '사유', opts: function () { return RP_REASONS.map(function (x) { return [x, x]; }); }, fn: function (r, v) { return r.reason === v; } }],
    sorts: [{ key: 'at', label: '접수 시각', val: function (r) { return r.at; } }, { key: 'status', label: '처리 상태', val: function (r) { return RP_IDX(r.status); } }, { key: 'reason', label: '사유', val: function (r) { return r.reason; } }],
    text: function (r) { return [r.q, r.a, r.detail, r.memo, r.reason].join(' '); },
    cols: ['접수 시각', '사유', '고객 질문', '고객 의견', '처리 상태', '메모', ''],
    row: function (r, open, key) {
      var so = RP_STATUS.map(function (x) { return '<option' + (x === r.status ? ' selected' : '') + '>' + x + '</option>'; }).join('');
      return '<tr class="rpc" data-rpid="' + esc(r.id) + '"><td data-label="접수 시각">' + esc(r.at) + '</td><td data-label="사유"><span class="badge b-bad">' + esc(r.reason) + '</span></td><td data-label="고객 질문">' + esc(clip(r.q, 32)) + '</td><td data-label="고객 의견">' + (r.detail ? esc(clip(r.detail, 32)) : '-') + '</td>' +
        '<td data-label="처리 상태"><select data-rp="status" aria-label="처리 상태">' + so + '</select></td><td data-label="메모">' + (r.memo ? esc(clip(r.memo, 20)) : '-') + '</td><td data-label="" class="act">' + tglBtn(key, open) + '</td></tr>';
    },
    detail: function (r) {
      return (r.q ? '<p class="lgq"><b>고객 질문</b> ' + esc(clip(r.q, 400)) + '</p>' : '') + '<p class="lgq"><b>신고된 답변</b> ' + esc(clip(r.a, 800)) + '</p>' + (r.detail ? '<p class="lgq"><b>고객 의견</b> ' + esc(r.detail) + '</p>' : '') +
        '<textarea class="lgg" data-rp="memo" rows="2" aria-label="처리 메모" placeholder="처리 메모 (예: 정책 문구 수정 필요)">' + esc(r.memo || '') + '</textarea>' +
        '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost" data-rp="tofb">피드백으로 보내기</button><button type="button" class="btn ghost" data-rp="del" style="color:var(--bad)">삭제</button></div>';
    }
  };

  /* 대화·피드백 탭 위쪽: 챗봇 지침 설정 + 보기 전환 */
  TABPRE.log = function () {
    var lv = A.lv === 'fb' ? 'fb' : A.lv === 'rp' ? 'rp' : 'log';
    return '<details class="ocard gdet"><summary>챗봇 지침 설정: 공통 지침과 현재 적용 중인 피드백 지침</summary>' +
      '<label style="display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px">공통 지침 (모든 답변에 적용)</label><textarea class="lgg" data-fb="guide" rows="2" placeholder="예: 답변은 3문장 이내로, 결론부터 말해 주세요.">' + esc(CH.guide) + '</textarea>' +
      '<div style="font-size:12px;color:var(--ink-soft);margin:10px 0 4px">지금 챗봇에 실제로 붙는 지침 미리보기</div><pre class="lgpre" id="lgPre"></pre></details>' +
      '<div class="lgtabs"><button type="button" class="pill' + (lv === 'log' ? ' sel' : '') + '" data-lv="log"></button><button type="button" class="pill' + (lv === 'fb' ? ' sel' : '') + '" data-lv="fb"></button><button type="button" class="pill' + (lv === 'rp' ? ' sel' : '') + '" data-lv="rp"></button>' +
      '<button type="button" class="pill" data-fba="clear" style="margin-left:auto;color:var(--bad)">' + (A.clr ? '한 번 더 누르면 대화 기록 삭제' : '대화 기록 삭제') + '</button></div>';
  };
  function updateLogMeta() {
    var p = document.getElementById('lgPre');
    if (p) { var g = feedbackGuide().text; p.textContent = g ? g.trim() : '반영할 피드백이 아직 없어요. 답변에 코멘트를 남기고 "다음 답변 지침에 반영"을 체크하면 여기에 나타나요.'; }
    var b1 = document.querySelector('[data-lv="log"]'), b2 = document.querySelector('[data-lv="fb"]'), b3 = document.querySelector('[data-lv="rp"]');
    if (b1) b1.textContent = '대화 기록 (' + CH.sessions.length + ')'; if (b2) b2.textContent = '저장된 피드백 (' + CH.feedback.filter(fbMeaningful).length + ')'; if (b3) b3.textContent = '신고 (' + CH.reports.length + ')';
    updateTabBadge(); if (A.tab === 'log') { refreshKpis(); var m = document.getElementById('admMeta'); if (m) m.textContent = admMeta('log'); }
  }
  function fbCtx(box, create) {
    var fid = box.getAttribute('data-fid'), eid = box.getAttribute('data-eid'), f = null, en = null;
    if (fid) f = CH.feedback.filter(function (x) { return x.id === fid; })[0] || null;
    else {
      var fe = findEntry(eid); en = fe && fe.e; f = fbByEid(eid) || null;
      if (!f && create && fe) { f = { id: uid('F'), eid: eid, sid: fe.s.id, q: fe.q, a: clip(fe.e.text, 600), rating: null, note: '', ideal: '', on: true, at: stampNow() }; CH.feedback.push(f); }
    }
    return { f: f, en: en };
  }
  function swapNode(node, html) { var t = document.createElement('div'); t.innerHTML = html; if (t.firstChild) node.replaceWith(t.firstChild); else node.remove(); }
  function fbRefresh(box, c) {
    if (box.closest('tr[data-fid]') || box.closest('.fbc')) renderList(); /* 피드백 목록: 표를 다시 그린다 */
    else { /* 대화 상세 안의 피드백 상자만 바꾸고, 위쪽 요약 행의 건수도 맞춘다 */
      var dt = box.closest('tr.dt'), dk = dt && dt.getAttribute('data-dk');
      swapNode(box, fbBox(c.en, c.f && fbMeaningful(c.f) || (c.f && c.f.on === false) ? c.f : null));
      if (dk) syncRow('log', dk);
    }
    updateLogMeta();
  }
  function rpOf(el0) { var c = el0.closest('.rpc'); return c ? { card: c, r: CH.reports.filter(function (x) { return x.id === c.getAttribute('data-rpid'); })[0] } : null; }

  var clrTimer = null;
  admBody.addEventListener('click', function (e) {
    var lv = e.target.closest('[data-lv]');
    if (lv) { A.lv = lv.getAttribute('data-lv'); renderAdmin(); return; }
    var ca = e.target.closest('[data-fba]');
    if (ca) {
      if (!A.clr) { A.clr = true; clearTimeout(clrTimer); clrTimer = setTimeout(function () { A.clr = false; if (A.tab === 'log') renderAdmin(); }, 3000); renderAdmin(); return; }
      clearTimeout(clrTimer); A.clr = false; CH.sessions = []; S.sid = null; saveChat(); if (FB) fbWipe('chatSessions').catch(function () { fbError(true); }); renderAdmin(); return;
    }
    var rb = e.target.closest('button[data-rp]');
    if (rb) {
      var o = rpOf(rb); if (!o || !o.r) return;
      var k = rb.getAttribute('data-rp'), r = o.r;
      if (k === 'del') { CH.reports = CH.reports.filter(function (x) { return x !== r; }); saveChat(); renderList(); updateLogMeta(); return; }
      if (k === 'tofb') { /* 신고를 챗봇 개선 피드백으로 넘김. 검토 전이라 지침 반영은 꺼진 채로 만든다 */
        var note = '신고 사유: ' + r.reason + (r.detail ? ' / ' + r.detail : ''), f = fbByEid(r.eid);
        if (!f) { f = { id: uid('F'), eid: r.eid, sid: r.sid, q: r.q, a: clip(r.a, 600), rating: 'bad', note: note, ideal: '', on: false, at: stampNow() }; CH.feedback.push(f); }
        else { if (!f.rating) f.rating = 'bad'; if (!f.note) f.note = note; f.at = stampNow(); }
        if (r.status === '접수') r.status = '확인 중';
        saveChat(); A.lv = 'fb'; A.open['fb:' + f.id] = true; renderAdmin();
      }
      return;
    }
    var b = e.target.closest('button[data-fb]'); if (!b) return;
    var box = b.closest('.fbx') || b.closest('.fbc'); if (!box) return;
    var kind = b.getAttribute('data-fb'), c = fbCtx(box, kind !== 'del');
    if (!c.f) return;
    if (kind === 'del') { CH.feedback = CH.feedback.filter(function (x) { return x !== c.f; }); saveChat(); fbRefresh(box, { f: null, en: c.en }); return; }
    c.f.rating = c.f.rating === kind ? null : kind; c.f.at = stampNow();
    if (!fbMeaningful(c.f)) CH.feedback = CH.feedback.filter(function (x) { return x !== c.f; });
    saveChat(); fbRefresh(box, c);
  });
  admBody.addEventListener('change', function (e) {
    var t = e.target, rk = t.getAttribute('data-rp');
    if (rk) { var o = rpOf(t); if (!o || !o.r) return; if (rk === 'status') o.r.status = t.value; else if (rk === 'memo') o.r.memo = t.value.trim(); saveChat(); updateLogMeta(); return; }
    var kind = t.getAttribute('data-fb'); if (!kind) return;
    if (kind === 'guide') { CH.guide = t.value; saveChat(); updateLogMeta(); return; }
    var box = t.closest('.fbx') || t.closest('[data-fid]'); if (!box) return;
    var c = fbCtx(box, true); if (!c.f) return;
    if (kind === 'on') { c.f.on = t.checked; saveChat(); updateLogMeta(); return; }
    if (kind === 'note' || kind === 'ideal') { c.f[kind] = t.value.trim(); c.f.at = stampNow(); saveChat(); updateLogMeta(); }
  });

  /* 목록 공통 조작: 수치 카드 필터, 검색, 필터, 정렬, 페이지, 상세 펼치기 (맨 마지막에 연결해 위의 편집 처리가 먼저 끝나게 한다) */
  function goPage(id) {
    var st = lst(id), inp = document.querySelector('#admList [data-pgin]'), pages = Math.max(1, Math.ceil(pipeline(id).length / PAGE));
    var n = Math.round(Number(inp && inp.value) || st.page); st.page = Math.min(pages, Math.max(1, n)); renderList();
  }
  var qTimer = null;
  admBody.addEventListener('input', function (e) {
    var t = e.target; if (!t.matches || !t.matches('[data-q]')) return;
    var id = curId(); clearTimeout(qTimer); qTimer = setTimeout(function () { lst(id).q = t.value; lst(id).page = 1; renderList(); }, 120);
  });
  admBody.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-pgin]')) { e.preventDefault(); goPage(curId()); } });
  admBody.addEventListener('click', function (e) {
    var id = curId(), L = LISTS[id]; if (!L) return;
    var kp = e.target.closest('[data-kpi]');
    if (kp) { var st = lst(id), key = kp.getAttribute('data-kpi'); st.kpi = (st.kpi === key && key !== 'all') ? 'all' : key; st.page = 1; refreshKpis(); renderList(); return; }
    var d = e.target.closest('[data-dir]');
    if (d) { var s2 = lst(id); s2.dir *= -1; d.textContent = s2.dir === 1 ? '오름차순 ↑' : '내림차순 ↓'; s2.page = 1; renderList(); return; }
    var pg = e.target.closest('[data-pg]');
    if (pg && !pg.disabled) { var v = pg.getAttribute('data-pg'); if (v === 'go') goPage(id); else { lst(id).page = Number(v); renderList(); } return; }
    var tg = e.target.closest('[data-tgl]');
    if (tg) { var k2 = tg.getAttribute('data-tgl'); A.open[k2] = !A.open[k2]; renderList(); return; }
    var la = e.target.closest('[data-lact]');
    if (la && la.getAttribute('data-lact') === 'samples') { addSampleOrders(10); lst('ord').page = 1; renderAdmin(); }
  });
  admBody.addEventListener('change', function (e) {
    var t = e.target, id = curId(); if (!LISTS[id]) return;
    if (t.matches('[data-flt]')) { lst(id).f[t.getAttribute('data-flt')] = t.value; lst(id).page = 1; renderList(); return; }
    if (t.matches('[data-sort]')) { lst(id).sort = t.value; lst(id).page = 1; renderList(); return; }
    if (t.closest('#admList')) { /* 목록 안에서 값을 고친 경우: 수치 카드와 위쪽 요약 행을 맞춘다 */
      refreshKpis();
      var dt = t.closest('tr.dt'); if (dt) syncRow(id, dt.getAttribute('data-dk'));
    }
  });

  updateTabBadge();
  if (SYNC.needSeed) fbSchedule();
  var bs = document.querySelector('.adm-brand small'); if (bs) bs.textContent = FB ? '클라우드 저장 (Firebase)' : '이 브라우저에 저장';
  var rf = document.getElementById('admRefresh'); if (rf) rf.hidden = !FB;
  startChat();
  var bt = document.getElementById('boot'); if (bt) bt.remove();
})().catch(function (e) { console.error(e); var bt = document.getElementById('boot'); if (bt) bt.textContent = '불러오지 못했어요. 새로고침해 주세요.'; });
</script>
</body>
</html>
